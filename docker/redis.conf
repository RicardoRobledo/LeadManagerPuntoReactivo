bind 0.0.0.0
protected-mode yes
daemonize no
dir /data

# AOF permite recuperar las escrituras al volver a iniciar Redis.
appendonly yes

# Confirma cada escritura en disco; prioriza durabilidad sobre rendimiento.
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

# AOF es la persistencia principal; no generar snapshots periodicos adicionales.
save ""

# Las tareas encoladas no deben eliminarse automaticamente por una politica de cache.
maxmemory-policy noeviction
