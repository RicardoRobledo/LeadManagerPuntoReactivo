{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lead Manager{% endblock %}</title>
  <style>
    .panel-background,
    .sidebar-background {
      background-color: #ffffff;
    }
    .sidebar-background {
      color: #20294b;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="panel-background">
  <!-- Botón hamburguesa flotante SOLO móvil - abajo derecha, siempre visible -->
  <button id="sidebar-toggle" class="fixed bottom-6 right-6 z-50 md:hidden bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-full shadow-2xl p-4 focus:outline-none hover:scale-110 transition-transform duration-200">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
    </svg>
  </button>
  
  <div class="flex min-h-screen">
    {% include 'prospects/sidebar.html' %}
    
    <!-- Contenedor principal que se ajusta al sidebar -->
    <main class="flex-1 min-w-0 w-full ml-0 md:ml-64">
      {% block content %}{% endblock %}
    </main>
  </div>
  
  <script>
    // Sidebar responsive (abre/cierra en móvil)
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('sidebar-toggle');
    
    toggle.addEventListener('click', function() {
      sidebar.classList.toggle('-translate-x-full');
    });
    
    // Al hacer click fuera del sidebar en móvil, lo cierra
    document.addEventListener('click', function(event) {
      if(window.innerWidth < 768){
        if(!sidebar.contains(event.target) && !toggle.contains(event.target)){
          sidebar.classList.add('-translate-x-full');
        }
      }
    });
  </script>
</body>
</html>
