<section id="agentReminderSchedule" data-reminder-schedule>
  <div class="mb-5">
    <h2 class="text-lg font-semibold text-slate-900">Tiempos de recordatorio</h2>
    <p class="mt-1 text-sm text-slate-500">Activa las etapas que quieras usar y define cuánto esperar entre cada recordatorio. La revisión se ejecuta cada hora.</p>
  </div>
  {{ prompt_form.reminder_schedule }}
  <p id="error_reminder_schedule" data-prompt-error="reminder_schedule" hidden class="mb-3 text-sm text-red-600"></p>
  <div class="space-y-3" data-reminder-rows></div>
  <p class="mt-2 text-xs text-slate-500">Máximo 3 intentos.</p>
</section>
