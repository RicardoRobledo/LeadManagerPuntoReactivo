<div class="space-y-2">
  <label for="agentSlider-{{ field.name }}" class="block text-sm font-semibold text-slate-700">{{ field.label }}</label>
  <div class="flex items-center justify-between gap-2 text-xs text-slate-500">
    {% for value, label in field.field.choices %}<span>{{ label }}</span>{% endfor %}
  </div>
  <input id="agentSlider-{{ field.name }}" type="range" min="0" max="2" step="1" value="0"
    data-prompt-slider="{{ field.name }}" data-slider-output="agentSliderOutput-{{ field.name }}"
    aria-label="{{ field.label }}" aria-valuetext="{{ field.field.choices.0.1 }}"
    aria-describedby="agentSliderOutput-{{ field.name }} error_{{ field.name }}"
    class="h-2 w-full cursor-pointer accent-indigo-600">
  <output id="agentSliderOutput-{{ field.name }}" class="block text-sm font-medium text-indigo-700">{{ field.field.choices.0.1 }}</output>
  {{ field }}
  <p id="error_{{ field.name }}" data-prompt-error="{{ field.name }}" hidden class="text-sm text-red-600"></p>
</div>
