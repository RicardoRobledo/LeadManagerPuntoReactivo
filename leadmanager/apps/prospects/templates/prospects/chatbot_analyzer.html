{% extends 'prospects/base_dashboard.html' %}

{% block title %}Analizador del chatbot | Lead Manager{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
    :root {
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --bg-main: #f8fafc;
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeOut {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(0.95); }
    }

    .message-anim { animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .clearing-anim { animation: fadeOut 0.2s ease-in forwards; }

    .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.8);
    }

    /* Estilos para el Markdown renderizado */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { 
        font-weight: 700; 
        margin-top: 1rem; 
        margin-bottom: 0.5rem;
        color: #1e293b;
    }
    .markdown-body h2 { font-size: 1.25rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    .markdown-body h3 { font-size: 1.1rem; }
    .markdown-body p { margin-bottom: 0.75rem; }
    .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
    .markdown-body strong { font-weight: 700; color: #4338ca; }
    .markdown-body code { background: #f1f5f9; padding: 2px 4px; border-radius: 4px; font-family: monospace; }

    .chat-container { height: calc(100vh - 120px); }
    .no-scrollbar::-webkit-scrollbar { width: 0px; background: transparent; }
    
    .typing-dot {
        width: 6px; height: 6px;
        background: var(--accent);
        border-radius: 50%;
        animation: pulse 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
</style>

<div class="w-full h-screen panel-background p-4 md:p-6 lg:p-10 flex flex-col font-sans antialiased">
    
    <div class="max-w-5xl w-full mx-auto flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-white rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center text-indigo-600">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Asistente</h1>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest">En línea</span>
                </div>
            </div>
        </div>

        <button id="clear-chat" class="p-2.5 text-slate-400 hover:text-rose-500 hover:bg-white rounded-xl transition-all border border-transparent hover:border-slate-100 shadow-none hover:shadow-sm" title="Reiniciar conversación">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
        </button>
    </div>

    <div class="max-w-5xl w-full mx-auto flex-1 flex flex-col min-h-0">
        <div id="chat-window" class="flex-1 overflow-y-auto px-2 space-y-8 no-scrollbar pb-10">
            </div>

        <div class="mt-4 relative">
            <form id="chat-form" class="relative flex items-center">
                {% csrf_token %}
                <input type="text" id="user-input" 
                       placeholder="Pregunta sobre los obstáculos en las ventas…"
                       class="w-full bg-white border border-slate-200 rounded-2xl py-5 pl-7 pr-20 shadow-xl shadow-slate-200/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-700 placeholder:text-slate-400">
                
                <div class="absolute right-3 flex items-center gap-2">
                    <button type="submit" id="submit-btn" 
                            class="bg-slate-900 text-white p-3 rounded-xl hover:bg-indigo-600 transition-all shadow-lg active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
            </form>
            <p class="text-[10px] text-center text-slate-400 mt-4 font-medium uppercase tracking-[0.2em]">Presiona Enter para analizar</p>
        </div>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatWindow = document.getElementById('chat-window');
    const submitBtn = document.getElementById('submit-btn');
    const clearBtn = document.getElementById('clear-chat');

    const welcomeMsg = "Hola. ¿Cómo puedo ayudarte?";
    
    let messageHistory = [];

    // Configurar marked para que sea seguro
    marked.setOptions({
        breaks: true, // Respeta los saltos de línea simples
        gfm: true    // GitHub Flavored Markdown
    });

    function initChat() {
        chatWindow.innerHTML = '';
        messageHistory = []; 
        const initialBotMsg = { role: 'assistant', content: welcomeMsg };
        messageHistory.push(initialBotMsg);
        appendMessage('assistant', initialBotMsg.content);
    }

    clearBtn.addEventListener('click', () => {
        const messages = chatWindow.children;
        Array.from(messages).forEach(m => m.classList.add('clearing-anim'));
        setTimeout(() => {
            initChat();
            userInput.placeholder = "Conversación reiniciada…";
            setTimeout(() => userInput.placeholder = "Pregunta sobre los obstáculos en las ventas…", 2000);
        }, 200);
    });

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = userInput.value.trim();
        if (!msg) return;

        const userMessage = { role: 'user', content: msg };
        messageHistory.push(userMessage);
        
        appendMessage('user', msg);
        userInput.value = '';
        setUI(true);

        const tid = showTyping();

        try {
            const response = await fetch('', { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({messages: messageHistory.slice(1).slice(-15)})
            });

            const data = await response.json();

            if (response.ok) {
                const botContent = data.response || "Análisis completado.";
                messageHistory.push({ role: 'assistant', content: botContent });
                
                const typingIndicator = document.getElementById(tid);
                if (typingIndicator) typingIndicator.remove();

                appendMessage('assistant', botContent);
            } else {
                throw new Error(data.error || "Error del servidor");
            }
        } catch (error) {
            const typingIndicator = document.getElementById(tid);
            if (typingIndicator) typingIndicator.remove();
            const errorMessage = error instanceof TypeError
                ? 'No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.'
                : error.message;
            appendMessage('assistant', `Error: ${errorMessage}`);
        } finally {
            setUI(false);
        }
    });

    function setUI(loading) {
        userInput.disabled = loading;
        submitBtn.style.opacity = loading ? '0.3' : '1';
        submitBtn.disabled = loading;
    }

    function appendMessage(role, text) {
        const isBot = role === 'assistant';
        const div = document.createElement('div');
        div.className = `flex ${isBot ? 'justify-start' : 'justify-end'} message-anim`;
        
        // Procesar Markdown si es el bot, de lo contrario texto plano
        const htmlContent = isBot ? marked.parse(text) : text;

        div.innerHTML = `
            <div class="max-w-[85%] md:max-w-[75%]">
                <div class="px-6 py-4 rounded-[24px] ${isBot ? 'glass-card text-slate-700 rounded-tl-none markdown-body' : 'bg-indigo-600 text-white shadow-lg shadow-indigo-200 rounded-tr-none'}">
                    <div class="text-[15px] leading-relaxed font-medium">
                        ${htmlContent}
                    </div>
                </div>
                <span class="text-[10px] text-slate-400 mt-2 block ${isBot ? 'ml-2' : 'mr-2 text-right'} font-bold uppercase tracking-widest">
                    ${isBot ? 'Asistente' : 'Tú'}
                </span>
            </div>
        `;
        chatWindow.appendChild(div);
        chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
    }

    function showTyping() {
        const id = 't-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'flex justify-start message-anim';
        div.innerHTML = `
            <div class="glass-card px-6 py-5 rounded-[24px] rounded-tl-none flex gap-1.5 items-center">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        chatWindow.appendChild(div);
        chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        return id;
    }

    initChat();
</script>
{% endblock %}
