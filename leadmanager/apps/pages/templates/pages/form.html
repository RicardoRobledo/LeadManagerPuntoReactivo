<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de equipo | Lead Manager</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colores de la marca */
            --header-gradient: linear-gradient(135deg, #4c1d95 0%, #6366f1 100%);
            --accent-orange: #f59e0b;
            --accent-orange-hover: #e6930a;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --error-red: #ef4444;
            --radius: 24px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* FONDO EXACTO DEL 404 */
            background: radial-gradient(circle at center, #4c1d95 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
            position: relative;
            overflow-x: hidden;
        }

        /* --- Animación de Entrada --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-container {
            width: 100%;
            max-width: 680px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 10; /* Asegura que el form esté sobre las formas de fondo */
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- Header --- */
        .card-header {
            background: var(--header-gradient);
            padding: 45px 30px;
            text-align: center;
            color: white;
        }

        .card-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* --- Cuerpo del Formulario --- */
        .card-body {
            padding: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .card-body { padding: 25px; }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* --- Inputs y Estados de Validación --- */
        .input {
            width: 100%;
            padding: 14px 18px;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dark);
            transition: var(--transition);
        }

        .input:focus {
            outline: none;
            background: white;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* Estilo de error */
        .input.is-invalid {
            border-color: var(--error-red);
            background-color: #fff0f0;
        }
        .input.is-invalid:focus {
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        /* Mensaje de error pequeño debajo del input */
        .error-message {
            font-size: 12px;
            color: var(--error-red);
            font-weight: 600;
            margin-top: -4px;
            margin-left: 4px;
            display: none; /* Oculto por defecto */
            animation: slideUp 0.3s ease;
        }

        .field.has-error .error-message {
            display: block; /* Mostrar si el padre tiene error */
        }

        textarea.input {
            resize: none;
            min-height: 90px;
        }

        /* --- Botón --- */
        .btn-submit {
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            background: var(--accent-orange);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            background: var(--accent-orange-hover);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(245, 158, 11, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        /* --- Formas de fondo (Del 404) --- */
        .circles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1; /* Detrás del formulario */
            pointer-events: none;
        }

        .circles div {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }

        .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.modal {
    background: white;
    padding: 30px;
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    animation: slideUp 0.4s ease;
}

.modal h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 10px;
}

.modal p {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 20px;
}

.modal button {
    padding: 12px 24px;
    background: var(--accent-orange);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.modal button:hover {
    background: var(--accent-orange-hover);
}

    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Error</h2>
            <p id="modalMessage">Ocurrió un error</p>
            <button id="modalClose">Aceptar</button>
        </div>
    </div>

    <div class="circles">
        <div style="width: 400px; height: 400px; top: -150px; left: -150px;"></div>
        <div style="width: 300px; height: 300px; bottom: -100px; right: -100px;"></div>
    </div>

    <div class="form-container">
        <div class="card">
            <header class="card-header">
                <h1>Solicitud de equipo</h1>
                <p>Completa el formulario para recibir una propuesta personalizada.</p>
            </header>

            <form id="cotizacionForm" class="card-body" novalidate>
                <div class="grid">
                    <div class="field">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="P. ej., Juan" class="input">
                        <small class="error-message">Mensaje de error</small>
                    </div>
                    <div class="field">
                        <label for="apellido">Apellido *</label>
                        <input type="text" id="apellido" name="apellido" placeholder="P. ej., Pérez" class="input">
                        <small class="error-message">Mensaje de error</small>
                    </div>
                </div>

                <div class="grid">
                    <div class="field">
                        <label for="telefono">Teléfono de contacto *</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="000 000 0000" class="input">
                        <small class="error-message">Mensaje de error</small>
                    </div>
                    <div class="field">
                        <label for="correo">Correo electrónico *</label>
                        <input type="email" id="correo" name="correo" placeholder="P. ej., nombre@empresa.com" class="input">
                        <small class="error-message">Mensaje de error</small>
                    </div>
                </div>

                <div class="field" style="margin-bottom: 20px;">
                    <label for="proposito">¿Para qué necesitas el equipo? *</label>
                    <textarea id="proposito" name="proposito" placeholder="P. ej., restauración de autos…" class="input"></textarea>
                    <small class="error-message">Mensaje de error</small>
                </div>

                <div class="field">
                    <label for="comentarios">Comentarios adicionales (opcional)</label>
                    <textarea id="comentarios" name="comentarios" placeholder="Opcional…" class="input"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Enviar información
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalMessage = document.getElementById('modalMessage');
const modalClose = document.getElementById('modalClose');

function showModal(title, message) {
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modalOverlay.classList.add('active');
}

modalClose.addEventListener('click', () => {
    modalOverlay.classList.remove('active');
});

            const form = document.getElementById('cotizacionForm');
            const submitBtn = document.getElementById('submitBtn');
            const originalBtnText = submitBtn.innerHTML;

            // Función auxiliar para mostrar errores
            const setError = (input, message) => {
                const field = input.closest('.field');
                const errorDisplay = field.querySelector('.error-message');
                
                input.classList.add('is-invalid');
                field.classList.add('has-error');
                errorDisplay.textContent = message;
            };

            // Función auxiliar para limpiar errores
            const clearError = (input) => {
                const field = input.closest('.field');
                const errorDisplay = field.querySelector('.error-message');
                
                input.classList.remove('is-invalid');
                field.classList.remove('has-error');
                errorDisplay.textContent = '';
            };

            // Función auxiliar para validar emails
            const isValidEmail = (email) => {
                const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
                return re.test(String(email).toLowerCase());
            };

            // Función auxiliar para validar teléfonos (Mínimo 10 dígitos, flexible con formato)
            const isValidPhone = (phone) => {
                // Elimina todo lo que no sea dígito
                const digits = phone.replace(/\D/g, '');
                // Acepta si tiene entre 10 y 20 dígitos
                return digits.length >= 10 && digits.length <= 20;
            };

            function getQueryParam(param) {
                const params = new URLSearchParams(window.location.search);
                return params.get(param);
            }

            // --- Lógica principal de validación al enviar ---
            form.addEventListener('submit', function(e) {
                e.preventDefault(); // Detiene el envío normal
                
                let isValid = true;

                // 1. Validar Nombre
                const nombre = document.getElementById('nombre');
                if (nombre.value.trim() === '') {
                    setError(nombre, 'El nombre es obligatorio.');
                    isValid = false;
                } else {
                    clearError(nombre);
                }

                // 2. Validar Apellido
                const apellido = document.getElementById('apellido');
                if (apellido.value.trim() === '') {
                    setError(apellido, 'El apellido es obligatorio.');
                    isValid = false;
                } else {
                    clearError(apellido);
                }

                // 3. Validar Teléfono
                const telefono = document.getElementById('telefono');
                if (telefono.value.trim() === '') {
                    setError(telefono, 'El teléfono es obligatorio.');
                    isValid = false;
                } else if (!isValidPhone(telefono.value)) {
                    setError(telefono, 'Introduce un teléfono válido de entre 10 y 20 dígitos.');
                    isValid = false;
                } else {
                    clearError(telefono);
                }

                // 4. Validar Correo
                const correo = document.getElementById('correo');
                if (correo.value.trim() === '') {
                    setError(correo, 'El correo es obligatorio.');
                    isValid = false;
                } else if (!isValidEmail(correo.value)) {
                    setError(correo, 'Introduce un correo electrónico válido.');
                    isValid = false;
                } else {
                    clearError(correo);
                }

                // 5. Validar Propósito
                const proposito = document.getElementById('proposito');
                if (proposito.value.trim() === '') {
                    setError(proposito, 'Cuéntanos para qué necesitas el equipo.');
                    isValid = false;
                } else {
                    clearError(proposito);
                }

                // --- Resultado final ---
                if (isValid) {
                    const WEBHOOK_URL = 'https://n8nestr.estrasol.com.mx/webhook/76b8c62d-aa70-4916-8d0a-b8a7783ccba0';
                    // Feedback visual de carga
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = 'Enviando…';

                    const formData = new FormData();
                    formData.append('nombre', nombre.value.trim());
                    formData.append('apellido', apellido.value.trim());
                    formData.append('correo', correo.value.trim());
                    formData.append('telefono', telefono.value.trim());
                    formData.append('interes', proposito.value.trim());
                    formData.append('medio_enterado', getQueryParam('source'));
                    formData.append('pregunta_comentario', comentarios.value.trim());

                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (response.status === 400) {
                            throw new Error('bad_request');
                        }
                        if (!response.ok) {
                            throw new Error('server_error');
                        }
                        return response.json().catch(() => ({}));
                    })
                    .then(data => {
                        showModal(
                            '¡Información enviada!',
                            'Tu solicitud se envió correctamente. Pronto nos pondremos en contacto contigo.'
                        );
                        form.reset();
                    })
                    .catch(error => {
                        if (error.message === 'bad_request') {
                            showModal(
                                'Datos no válidos',
                                'No se pudo procesar la información enviada. Revisa los datos e inténtalo de nuevo.'
                            );
                        } else {
                            showModal(
                                'Error de conexión',
                                'No se pudo conectar con el servidor. Intenta de nuevo.'
                            );
                        }
                    })
                    .finally(() => {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    });
                    
                    // Si usas un backend real, descomenta esto y quita el setTimeout:
                    // form.submit(); 
                } else {
                    // Si hay errores, hacer scroll al primer error
                    const firstError = document.querySelector('.has-error');
                    if (firstError) {
                        firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            });

            // Opcional: Limpiar errores mientras el usuario escribe
            const inputs = form.querySelectorAll('.input');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    if (this.classList.contains('is-invalid')) {
                        clearError(this);
                    }
                });
            });
        });
    </script>

</body>
</html>
